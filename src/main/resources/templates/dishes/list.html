<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="#{dish.list.title}"></title><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><main class="container">
<header class="page-header"><div><h1 th:text="#{dish.list.title}"></h1><p th:text="#{dish.list.intro}"></p></div><nav class="actions"><a class="button" th:href="@{/dishes/create}" th:text="#{dish.create}"></a><a class="button secondary" th:href="@{/categories}" th:text="#{category.title}"></a></nav></header>
<nav class="language"><a th:href="${englishUrl}">English</a> · <a th:href="${vietnameseUrl}">Tiếng Việt</a></nav>
<form class="card filter-form" method="get" th:action="@{/dishes}" th:object="${filter}">
<div><label for="name" th:text="#{filter.name}"></label><input id="name" th:field="*{name}" type="text"></div>
<div><label for="category" th:text="#{field.category}"></label><select id="category" th:field="*{category}"><option value="" th:text="#{filter.allCategories}"></option><option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option></select></div>
<div><label for="available" th:text="#{field.status}"></label><select id="available" th:field="*{available}"><option value="" th:text="#{filter.allStatus}"></option><option value="true" th:text="#{status.available}"></option><option value="false" th:text="#{status.unavailable}"></option></select></div>
<div><label for="minPrice" th:text="#{filter.minPrice}"></label><input id="minPrice" type="number" step="0.01" th:field="*{minPrice}"></div>
<div><label for="maxPrice" th:text="#{filter.maxPrice}"></label><input id="maxPrice" type="number" step="0.01" th:field="*{maxPrice}"></div>
<div><label for="sort" th:text="#{filter.sort}"></label><select id="sort" th:field="*{sort}"><option value="" th:text="#{filter.default}"></option><option value="priceAsc" th:text="#{filter.priceAsc}"></option><option value="priceDesc" th:text="#{filter.priceDesc}"></option><option value="preparationTimeAsc" th:text="#{filter.timeAsc}"></option></select></div>
<div class="actions"><button class="button" type="submit" th:text="#{filter.search}"></button><a class="button secondary" th:href="@{/dishes}" th:text="#{filter.clear}"></a></div>
</form>
<p class="alert error" th:if="${filterError}" th:text="#{${filterError}}"></p>
<div class="table-wrap" th:if="${!#lists.isEmpty(dishes)}"><table><thead><tr><th th:text="#{field.id}"></th><th th:text="#{field.name}"></th><th th:text="#{field.category}"></th><th th:text="#{field.price}"></th><th th:text="#{field.preparationTime}"></th><th th:text="#{field.classification}"></th><th th:text="#{field.status}"></th><th th:text="#{field.actions}"></th></tr></thead>
<tbody><tr th:each="dish : ${dishes}"><td th:text="${dish.id}"></td><td th:text="${dish.name}"></td><td th:text="${dish.dishCategory.name}"></td><td th:text="${dish.price}"></td><td th:text="${dish.preparationTime}"></td><td><span th:if="${dish.quickPreparation}" th:text="#{classification.quick}"></span><span th:unless="${dish.quickPreparation}" th:text="#{classification.regular}"></span></td><td><span class="status available" th:if="${dish.isAvailable == true}" th:text="#{status.available}"></span><span class="status unavailable" th:unless="${dish.isAvailable == true}" th:text="#{status.unavailable}"></span></td><td class="row-actions"><a th:href="@{/dishes/{id}(id=${dish.id})}" th:text="#{action.detail}"></a><a th:href="@{/dishes/{id}/edit(id=${dish.id})}" th:text="#{action.edit}"></a></td></tr></tbody></table></div>
<p class="notice" th:if="${#lists.isEmpty(dishes) and filterError == null}" th:text="#{dish.noResults}"></p>
</main></body></html>
